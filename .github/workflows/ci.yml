name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ofix
          POSTGRES_PASSWORD: ofix
          POSTGRES_DB: ofix_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ofix -d ofix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # mermaid-cli (ERD generator) pulls puppeteer; the browser download
          # is pointless in CI because the ERD is only generated locally.
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Generate Prisma client
        run: pnpm --filter @ofix/api db:generate

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify assistant context is up to date
        run: pnpm assistant:context:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web/coverage
            packages/shared/coverage
          retention-days: 14

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ofix
          POSTGRES_PASSWORD: ofix
          POSTGRES_DB: ofix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofix -d ofix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://ofix:ofix@localhost:5432/ofix
      DATABASE_URL: postgresql://ofix:ofix@localhost:5432/ofix
      JWT_SECRET: e2e-secret-with-at-least-32-characters!!
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Generate Prisma client
        run: pnpm --filter @ofix/api db:generate

      - name: Build
        run: pnpm build

      - name: Migrate and seed
        run: |
          pnpm --filter @ofix/api db:deploy
          pnpm db:seed

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E flows
        run: pnpm test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7
