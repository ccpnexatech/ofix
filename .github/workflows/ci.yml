name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ofix
          POSTGRES_PASSWORD: ofix
          POSTGRES_DB: ofix_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ofix -d ofix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # mermaid-cli (ERD generator) pulls puppeteer; the browser download
          # is pointless in CI because the ERD is only generated locally.
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Generate Prisma client
        run: pnpm --filter @ofix/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
